name: Tests and two-stage recommendation smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-lock.txt -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: python -m pytest -q --cov=recsys --cov-report=term-missing
      - run: python -m recsys.cli train --config config/smoke.json --output reports/ci
      - run: python -m recsys.cli recommend --artifacts reports/ci/artifacts --user 0 --k 10
      - uses: actions/upload-artifact@v7
        with:
          name: synthetic-experiment-${{ matrix.os }}
          path: reports/ci/
          if-no-files-found: error
